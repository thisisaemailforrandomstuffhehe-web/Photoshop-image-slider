<!DOCTYPE html>
<html>
<head>
<style>
.container {
  position: relative;
  width: 100%;
  max-width: 800px;
  aspect-ratio: 16 / 9; /* keeps image proportions */
  overflow: hidden;
}

.container img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain; /* keeps full image visible */
}

.top {
  width: 50%;
  overflow: hidden;
  position: absolute;
  height: 100%;
}

.slider {
  width: 100%;
  max-width: 800px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

  <!-- bottom image -->
  <img src="bottom.jpg">

  <!-- top image -->
  <div class="top" id="top">
    <img src="top.jpg">
  </div>

</div>

<input type="range" min="0" max="100" value="50" class="slider" id="slider">

<script>
const slider = document.getElementById("slider");
const topDiv = document.getElementById("top");

slider.oninput = () => {
  topDiv.style.width = slider.value + "%";
};
</script>

</body>
</html>
