<!DOCTYPE html>
<html>
<head>
<style>
.container {
  position: relative;
  width: 600px;
  height: 400px;
  overflow: hidden;
}

.bottom, .top {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.top-wrapper {
  position: absolute;
  width: 50%;
  height: 100%;
  overflow: hidden;
}
</style>
</head>
<body>

<div class="container">
  <img class="bottom" src="bottom.jpg">

  <div class="top-wrapper" id="topWrap">
    <img class="top" src="top.jpg">
  </div>
</div>

<input type="range" min="0" max="100" value="50" id="slider">

<script>
const slider = document.getElementById("slider");
const topWrap = document.getElementById("topWrap");

slider.oninput = () => {
  topWrap.style.width = slider.value + "%";
};
</script>

</body>
</html>
